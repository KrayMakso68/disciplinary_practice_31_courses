{% extends 'main/layout.html' %}
{% load static %}

{% block title %}
Запись
{% endblock %}


{% block content %}
    <div class="d-flex align-items-center mb-3 mt-3">
        <button onclick="history.back();" class="btn btn-sm btn-outline-secondary me-3 d-inline-flex align-items-center gap-1 py-1 px-2" style="font-size: 0.82rem;">
            <span data-feather="arrow-left" style="width: 14px; height: 14px;"></span> Назад
        </button>
        <div>
            <h2 class="h5 mb-0 fw-semibold text-dark">Добавление записи</h2>
            <div class="text-muted small">Сотрудник: {{ for_user.get_FIO }}</div>
        </div>
    </div>

    <div class="content-container mx-auto" style="max-width: 650px;">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-2 px-3 border-bottom">
                <h5 class="h6 mb-0 fw-semibold text-dark">Форма фиксации события</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;" for="{{ form.type.id_for_label }}">Вид записи</label>
                        {{ form.type }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;" for="{{ form.text.id_for_label }}">Текст / Описание</label>
                        {{ form.text }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;" for="{{ form.date.id_for_label }}">Дата</label>
                        {{ form.date }}
                    </div>
                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a onclick="history.back();" class="btn btn-sm btn-outline-secondary px-3">Отмена</a>
                        <button type="submit" class="btn btn-sm btn-primary px-3">Сохранить запись</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
